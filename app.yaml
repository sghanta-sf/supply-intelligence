command:
  - sh
  - -c
  - python -m uvicorn backend.main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}
env:
  - name: LAKEBASE_PROJECT
    value: supply-intelligence
  - name: LAKEBASE_ENDPOINT
    value: projects/supply-intelligence/branches/production/endpoints/primary
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  - name: MODEL_SERVING_ENDPOINT
    value: databricks-claude-sonnet-4-6
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
