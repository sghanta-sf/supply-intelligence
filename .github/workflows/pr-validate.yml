name: Validate PR & Lakebase Branch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --dev
      - run: uv run pytest
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  migration-branch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: lakebase-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python scripts/lakebase_ci.py validate-pr --pr "${{ github.event.pull_request.number }}"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          LAKEBASE_PROJECT: projects/supply-intelligence
          LAKEBASE_SOURCE_BRANCH: projects/supply-intelligence/branches/production
          LAKEBASE_DATABASE: databricks_postgres
